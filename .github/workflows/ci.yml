name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26.x'
          check-latest: true
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: python -m pip install ansible-core==2.20.11 pexpect==4.9.0
      - name: Check formatting and dependencies
        run: |
          test -z "$(gofmt -l cmd internal)"
          go mod verify
      - name: Vet and test
        env:
          SERVERFORGE_REQUIRE_ANSIBLE_VAULT: '1'
        run: |
          go vet ./...
          go test -race -cover ./...
      - name: Syntax-check Ansible assets
        run: python tests/ansible_syntax.py
      - name: Build and exercise the CLI
        run: |
          go build -o "$RUNNER_TEMP/serverforge" ./cmd/serverforge
          "$RUNNER_TEMP/serverforge" validate --config examples/local.yaml
          "$RUNNER_TEMP/serverforge" preflight --config examples/local.yaml --json
          "$RUNNER_TEMP/serverforge" preflight --config examples/ssh.yaml --json
          python tests/wizard_smoke.py "$RUNNER_TEMP/serverforge"
