name: Release Linux binaries

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26.11'
      - name: Build and check release assets
        run: |
          mkdir dist
          for arch in amd64 arm64; do
            CGO_ENABLED=0 GOOS=linux GOARCH="$arch" go build -trimpath -buildvcs=false \
              -o "dist/serverforge-linux-$arch" ./cmd/serverforge
            expected=$(awk -v arch="$arch" '$1 == arch ")" {sub(/^binary_sha=/, "", $2); print $2}' bootstrap.sh)
            printf '%s  %s\n' "$expected" "dist/serverforge-linux-$arch" | sha256sum -c -
          done
          (cd dist && sha256sum serverforge-linux-* > SHA256SUMS)
          dist/serverforge-linux-amd64 --version
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release create "$RELEASE_TAG" dist/* --verify-tag --generate-notes
