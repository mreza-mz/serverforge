---
- name: Detect an existing Fail2ban installation
  ansible.builtin.stat:
    path: /usr/bin/fail2ban-client
  register: sf_fail2ban_existing

- name: Install Fail2ban and its systemd journal reader
  ansible.builtin.apt:
    name: [fail2ban, python3-systemd]
    state: present
    update_cache: true
    cache_valid_time: 3600
    policy_rc_d: 101

- name: Hold newly installed Fail2ban inactive before the guarded setup
  ansible.builtin.systemd_service:
    name: fail2ban
    state: stopped
    enabled: false
  when: not ansible_check_mode and not sf_fail2ban_existing.stat.exists

- name: Converge installed Fail2ban
  ansible.builtin.include_tasks: configure.yml
  when: not ansible_check_mode or 'fail2ban' in ansible_facts.packages
