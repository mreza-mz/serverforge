---
- name: Install Ubuntu Docker Engine packages
  ansible.builtin.apt:
    name: docker.io
    state: present
    update_cache: true
    cache_valid_time: 3600
    policy_rc_d: 101

- name: Enable and start Docker Engine
  ansible.builtin.systemd_service:
    name: docker
    state: started
    enabled: true
  when: not ansible_check_mode or 'docker.io' in ansible_facts.packages

- name: Verify Docker Engine responds
  ansible.builtin.command: /usr/bin/docker info
  changed_when: false
  when: not ansible_check_mode
